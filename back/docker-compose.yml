services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sivigila
      POSTGRES_PASSWORD: sivigila
      POSTGRES_DB: sivigila
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivigila"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://sivigila:sivigila@db:5432/sivigila
      SECRET_KEY: dev-secret-change-me
      SQL_ECHO: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
