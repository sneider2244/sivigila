services:
  postgres:
    image: postgres:16
    container_name: sivigila-postgres
    environment:
      POSTGRES_USER: sivigila
      POSTGRES_PASSWORD: sivigila
      POSTGRES_DB: sivigila
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivigila -d sivigila"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sivigila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
