<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inicio{% endblock %} · SIVIGILA Moderno</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand__icon">🩺</span>
        <span class="brand__name">SIVIGILA</span>
        <span class="brand__sub">Moderno</span>
      </div>
      <nav class="nav">
        {% for item in nav_items %}
        <a class="nav__item {% if item.key == active %}is-active{% endif %}" href="{{ item.href }}">
          <span class="nav__icon">{{ item.icon }}</span>{{ item.label }}
        </a>
        {% endfor %}
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
