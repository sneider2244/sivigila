{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  {% if enlace %}
    <p><a class="btn primario" href="{{ enlace }}">{{ enlace_texto }}</a></p>
  {% elif not usuario %}
    <p><a href="/login">Ir a iniciar sesión</a></p>
  {% endif %}
</section>
{% endblock %}
